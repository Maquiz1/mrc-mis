{% extends 'base.html' %}

{% block content %}
<h2>Country: {{ object.name }}</h2>

<a href="{% url 'locations:region-create' %}?country={{ object.id }}" class="btn btn-success mb-3">
    Add Region
</a>

<h3>Regions</h3>
<table class="table table-bordered table-striped">
    <thead class="table-dark">
        <tr>
            <th>Name</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for region in object.region_set.all %}
        <tr>
            <td>
                <a href="{% url 'locations:region-detail' region.id %}">{{ region.name }}</a>
            </td>
            <td>
                <a href="{% url 'locations:region-edit' region.id %}" class="btn btn-warning btn-sm">Edit</a>
                <a href="{% url 'locations:region-delete' region.id %}" class="btn btn-danger btn-sm">Delete</a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="2">No regions found.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
