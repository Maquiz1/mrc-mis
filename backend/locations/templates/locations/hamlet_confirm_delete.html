{% extends "base.html" %}
{% block title %}Delete Hamlet{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>Delete Hamlet: {{ object.name }}</h2>
    <p>Are you sure you want to delete this hamlet? This action cannot be undone.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'locations:hamlet-list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
