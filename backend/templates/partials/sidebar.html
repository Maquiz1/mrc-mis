{% load static %}

<style>
    .sidebar a,
    .sidebar .collapse a {
        display: flex;
        align-items: center;
        padding: 8px 20px;
        text-decoration: none;
        color: #fff;
        transition: background 0.3s, color 0.3s;
    }

    .sidebar a:hover,
    .sidebar .collapse a:hover {
        background-color: #495057;
        color: #fff;
    }

    .sidebar a.active,
    .sidebar .collapse a.active {
        background-color: #007bff;
        color: #fff;
    }

    .sidebar i {
        margin-right: 8px;
    }
</style>

<div class="sidebar" id="sidebar">
    <h2>📘 MRC-MIS</h2>

    <a href="{% url 'dashboard:dashboard' %}"
        class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
        <i class="fas fa-tachometer-alt"></i><span> Dashboard</span>
    </a>
    <a href="{% url 'users:staff_list' %}"
        class="{% if request.resolver_match.url_name == 'staff_list' %}active{% endif %}">
        <i class="fas fa-users"></i><span> Staffs</span>
    </a>

    <!-- Locations -->
    <a data-bs-toggle="collapse" href="#collapseLocations" role="button" aria-expanded="false"
        aria-controls="collapseLocations">
        <i class="fas fa-map-marker-alt"></i><span> Locations</span>
        <i class="fas fa-chevron-down ms-auto"></i>
    </a>
    <div class="collapse {% if request.resolver_match.url_name in 'country-list region-list district-list ward-list villagestreet-list hamlet-list site-list' %}show{% endif %}"
        id="collapseLocations">
        <a href="{% url 'locations:country-list' %}"
            class="{% if request.resolver_match.url_name == 'country-list' %}active{% endif %}">
            <i class="fas fa-globe"></i> Countries
        </a>
        <a href="{% url 'locations:region-list' %}"
            class="{% if request.resolver_match.url_name == 'region-list' %}active{% endif %}">
            <i class="fas fa-map"></i> Regions
        </a>
        <a href="{% url 'locations:district-list' %}"
            class="{% if request.resolver_match.url_name == 'district-list' %}active{% endif %}">
            <i class="fas fa-map-marker-alt"></i> Districts
        </a>
        <a href="{% url 'locations:ward-list' %}"
            class="{% if request.resolver_match.url_name == 'ward-list' %}active{% endif %}">
            <i class="fas fa-layer-group"></i> Wards
        </a>
        <a href="{% url 'locations:villagestreet-list' %}"
            class="{% if request.resolver_match.url_name == 'villagestreet-list' %}active{% endif %}">
            <i class="fas fa-road"></i> Villages/Streets
        </a>
        <a href="{% url 'locations:hamlet-list' %}"
            class="{% if request.resolver_match.url_name == 'hamlet-list' %}active{% endif %}">
            <i class="fas fa-home"></i> Hamlets
        </a>
        <a href="{% url 'locations:site-list' %}"
            class="{% if request.resolver_match.url_name == 'site-list' %}active{% endif %}">
            <i class="fas fa-building"></i> Sites
        </a>
    </div>

    <!-- Clinical & Mentorship -->
    <!-- <a href="{% url 'clinical:disease-list' %}"
        class="{% if request.resolver_match.url_name == 'disease-list' %}active{% endif %}">
        <i class="fas fa-virus"></i><span> Diseases</span>
    </a>
    <a href="{% url 'mentorship:visit-list' %}"
        class="{% if request.resolver_match.url_name == 'visit-list' %}active{% endif %}">
        <i class="fas fa-calendar-check"></i><span> Visits</span>
    </a> -->

    <!-- Reports & Household -->
    <a href="{% url 'reports:index' %}" class="{% if request.resolver_match.url_name == 'index' %}active{% endif %}">
        <i class="fas fa-chart-line"></i><span> Reports</span>
    </a>

    <!-- Expectations -->
    <a data-bs-toggle="collapse" href="#collapseExpectations" role="button" aria-expanded="false"
        aria-controls="collapseExpectations">
        <i class="fas fa-list"></i><span> Expectations</span>
        <i class="fas fa-chevron-down ms-auto"></i>
    </a>
    <div class="collapse {% if request.resolver_match.url_name in 'expectation-list expectation-upload' %}show{% endif %}"
        id="collapseExpectations">
        <a href="{% url 'household:expectation-list' %}"
            class="{% if request.resolver_match.url_name == 'expectation-list' %}active{% endif %}">
            <i class="fas fa-eye"></i> View
        </a>
        <a href="{% url 'household:expectation-upload' %}"
            class="{% if request.resolver_match.url_name == 'expectation-upload' %}active{% endif %}">
            <i class="fas fa-upload"></i> Upload
        </a>
        <a href="{% url 'household:expectation-download' %}" class="">
            <i class="fas fa-download"></i> Download
        </a>
    </div>


    <!-- Household -->
    <a data-bs-toggle="collapse" href="#collapseHousehold" role="button" aria-expanded="false"
        aria-controls="collapseHousehold">
        <i class="fas fa-home"></i><span> Household</span>
        <i class="fas fa-chevron-down ms-auto"></i>
    </a>
    <div class="collapse {% if request.resolver_match.url_name in 'household-list household-upload household-download' %}show{% endif %}"
        id="collapseHousehold">
        <a href="{% url 'household:household-list' %}"
            class="{% if request.resolver_match.url_name == 'household-list' %}active{% endif %}">
            <i class="fas fa-list"></i> View
        </a>
        <a href="{% url 'household:household-upload' %}"
            class="{% if request.resolver_match.url_name == 'household-upload' %}active{% endif %}">
            <i class="fas fa-upload"></i> Upload 
        </a>
        <a href="{% url 'household:household-template-download' %}" class="">
            <i class="fas fa-download"></i> Download
        </a>
    </div>


    <!-- Documents -->
    <a href="{% url 'documents:usermanual-list' %}"
        class="{% if request.resolver_match.url_name == 'usermanual-list' %}active{% endif %}">
        <i class="fas fa-book"></i><span> User Manuals</span>
    </a>

    <!-- Authentication -->
    {% if user.is_authenticated %}
    <a href="{% url 'users:logout' %}">
        <i class="fas fa-sign-out-alt"></i><span> Logout</span>
    </a>
    {% else %}
    <a href="{% url 'users:login' %}">
        <i class="fas fa-sign-in-alt"></i><span> Login</span>
    </a>
    {% endif %}
</div>
