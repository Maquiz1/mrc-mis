{% extends "base.html" %}
{% block title %}Upload Households{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <h2 class="text-center mb-4">Upload Households CSV</h2>

                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                                {{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                            </div>
                        {% endfor %}
                    {% endif %}

                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="veo" class="form-label">Select VEO</label>
                            <select name="veo" id="veo" class="form-select" required>
                                <option value="">-- Select VEO --</option>
                                {% for user in veo_users %}
                                    <option value="{{ user.id }}">{{ user.username }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="file" class="form-label">Select CSV File</label>
                            <input type="file" name="file" id="file" class="form-control" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Upload</button>
                    </form>

                    <div class="mt-3 text-center">
                        <a href="{% url 'household:household-list' %}" class="text-decoration-none">&larr; Back to Household List</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
