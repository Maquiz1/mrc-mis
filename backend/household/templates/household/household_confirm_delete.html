{% extends 'base.html' %}

{% block content %}
<h2 class="mb-4">Confirm Delete Household</h2>

<p>Are you sure you want to delete the household: <strong>{{ object.household_head_name }}</strong>?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'household:household-list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
