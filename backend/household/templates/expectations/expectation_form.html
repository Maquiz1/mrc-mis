{% extends 'base.html' %}
{% block content %}
<h2>{% if view.object %}Edit{% else %}Add{% endif %} Hamlet Household Expectation</h2>

<form method="post">
    {% csrf_token %}
    {% for field in form %}
        <div class="mb-3">
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
                <div class="text-danger">{{ field.errors|striptags }}</div>
            {% endif %}
        </div>
    {% endfor %}
    <button type="submit" class="btn btn-primary">{% if view.object %}Update{% else %}Save{% endif %}</button>
</form>

<a href="{% url 'household:expectation-list' %}" class="btn btn-secondary mt-3">Back to List</a>
{% endblock %}
